<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="Kayıtlı ritimleri tempo ayarıyla çalın: türküler, oyun havaları, halaylar, aksak usuller ve metronom." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ritim" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Ritim</title>
    <script>
      // A style or script of an older version could not be loaded (site updated meanwhile): reload once.
      addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'LINK' && t.tagName !== 'SCRIPT')) return;
          try {
            if (sessionStorage.getItem('ritim-reload')) return;
            sessionStorage.setItem('ritim-reload', '1');
          } catch (x) {}
          location.reload();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
